<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Career Path</title>
    <!-- Toastify Notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        /* ===== Modern Form CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }

        .container {
            background: #fff;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
        }

        .container p.description {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        form label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }

        form input[type="email"] {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        form input:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 6px rgba(108, 99, 255, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.btn-primary {
            background: linear-gradient(90deg, #6C63FF, #9C6CFF);
            color: #fff;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 99, 255, 0.35);
        }

        button.btn-secondary {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        button.btn-secondary:hover {
            background: #f1f5f9;
        }

    </style>
</head>
<body>

<header>
    <h1>Recover Account</h1>
</header>

<div class="container">
    <p class="description">Enter the email address associated with your account and we'll send you a securely generated reset code.</p>
    
    <form id="forgotForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="example@mail.com" required>

        <button type="submit" class="btn-primary" id="submitBtn">Send Reset Code</button>
        <button type="button" class="btn-secondary" onclick="location.href='login.html'">Back to Login</button>
    </form>
</div>

<script>
    document.getElementById("forgotForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const email = document.getElementById("email").value;
        const btn = document.getElementById("submitBtn");
        
        if (!email) {
            Toastify({ text: "Please enter your email!", duration: 3000, style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } }).showToast();
            return;
        }

        btn.disabled = true;
        btn.innerText = "Sending...";

        try {
            const resp = await fetch("/api/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });

            const data = await resp.json();
            
            if (resp.ok) {
                // If it's a success, store the email temporarily so they don't have to type it again
                localStorage.setItem("resetEmail", email);
                
                Toastify({ 
                    text: data.message || "Code sent to your email (if registered).", 
                    duration: 3000, 
                    style: { background: "linear-gradient(to right, #4f46e5, #7c3aed)" } 
                }).showToast();

                setTimeout(() => window.location.href = "reset-password.html", 2500);
            } else {
                Toastify({ 
                    text: data.error || "Failed to process request.", 
                    duration: 3000, 
                    style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } 
                }).showToast();
            }
        } catch (err) {
            console.error(err);
            Toastify({ text: "Connection error!", duration: 3000, style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } }).showToast();
        } finally {
            btn.disabled = false;
            btn.innerText = "Send Reset Code";
        }
    });
</script>
</body>
</html>
