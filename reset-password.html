<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Career Path</title>
    <!-- Toastify Notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        /* ===== Modern Form CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }

        .container {
            background: #fff;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
        }

        form label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }

        form input[type="email"],
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        form input:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 6px rgba(108, 99, 255, 0.3);
            outline: none;
        }

        .password-wrapper {
            position: relative;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.btn-primary {
            background: linear-gradient(90deg, #6C63FF, #9C6CFF);
            color: #fff;
            margin-bottom: 10px;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 99, 255, 0.35);
        }
        
        button.btn-secondary {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            margin-top: 0;
        }

        button.btn-secondary:hover {
            background: #f1f5f9;
        }

    </style>
</head>
<body>

<header>
    <h1>Create New Password</h1>
</header>

<div class="container">
    <form id="resetForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="example@mail.com" required readonly style="background: #f1f5f9;">

        <label for="token">6-Digit Reset Code</label>
        <input type="text" id="token" placeholder="123456" required autocomplete="off">

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" placeholder="••••••••" required minlength="6">

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" placeholder="••••••••" required minlength="6">

        <button type="submit" class="btn-primary" id="submitBtn">Update Password</button>
        <button type="button" class="btn-secondary" onclick="location.href='login.html'">Back to Login</button>
    </form>
</div>

<script>
    // Pre-fill email from localStorage if available
    const savedEmail = localStorage.getItem("resetEmail");
    if (savedEmail) {
        document.getElementById("email").value = savedEmail;
    } else {
        document.getElementById("email").removeAttribute("readonly");
        document.getElementById("email").style.background = "#fff";
    }

    document.getElementById("resetForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const email = document.getElementById("email").value;
        const token = document.getElementById("token").value;
        const new_password = document.getElementById("new_password").value;
        const confirm_password = document.getElementById("confirm_password").value;
        const btn = document.getElementById("submitBtn");

        if (new_password.length < 6) {
            Toastify({ text: "Password must be at least 6 characters long!", duration: 3000, style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } }).showToast();
            return;
        }

        if (new_password !== confirm_password) {
            Toastify({ text: "Passwords do not match!", duration: 3000, style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } }).showToast();
            return;
        }

        btn.disabled = true;
        btn.innerText = "Updating...";

        try {
            const resp = await fetch("/api/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, token, new_password })
            });

            const data = await resp.json();
            
            if (resp.ok) {
                Toastify({ 
                    text: "Password updated successfully!", 
                    duration: 3000, 
                    style: { background: "linear-gradient(to right, #4f46e5, #7c3aed)" } 
                }).showToast();

                // Clear temporary email
                localStorage.removeItem("resetEmail");

                setTimeout(() => window.location.href = "login.html", 2000);
            } else {
                Toastify({ 
                    text: data.error || "Failed to reset password.", 
                    duration: 3000, 
                    style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } 
                }).showToast();
            }
        } catch (err) {
            console.error(err);
            Toastify({ text: "Connection error!", duration: 3000, style: { background: "linear-gradient(to right, #f43f5e, #fb7185)" } }).showToast();
        } finally {
            btn.disabled = false;
            btn.innerText = "Update Password";
        }
    });
</script>
</body>
</html>
